<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5f5f7">
    <meta name="description" content="小Link，你的私人链接收藏空间。收藏灵感，轻松抵达。">
    <script>
        try {
            const theme = localStorage.getItem('nexus_theme_preference');
            document.documentElement.classList.toggle('dark', theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches));
        } catch (_) {}
    </script>
    <title>小Link - 网址管理</title>
    <link rel="icon" type="image/png" href="assets/site-icon.png">
    <link rel="apple-touch-icon" href="assets/site-icon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a class="skip-link" href="#main-content">跳到收藏内容</a>
    <div id="sort-announcer" class="sr-only" role="status" aria-live="polite"></div>
    <div id="search-status" class="sr-only" role="status" aria-live="polite"></div>

    <div class="shell">
        <header class="appbar">
            <div class="appbar-inner">
            <div class="sidebar-brand">
                <button type="button" id="sidebar-toggle" class="icon-button sidebar-toggle" aria-label="打开分类" aria-expanded="false" aria-controls="category-sidebar"><i data-lucide="panel-left"></i></button>
                <div class="brand">
                    <span class="brand-mark" aria-hidden="true"><i data-lucide="layout-grid"></i></span>
                    <span class="brand-text">
                        <span class="brand-name">小Link</span>
                        <span class="brand-sub">你的数字收藏空间</span>
                    </span>
                </div>

            </div>

            <div class="topbar-actions">
                <div class="search-field">
                    <i data-lucide="search"></i>
                    <input type="text" id="search-input" aria-label="搜索链接" placeholder="搜索你的收藏" autocomplete="off" spellcheck="false">
                    <kbd class="search-kbd" aria-hidden="true">/</kbd>
                    <button type="button" id="clear-search" class="search-clear" aria-label="清空搜索" hidden>
                        <i data-lucide="x"></i>
                    </button>
                </div>
                <div class="view-switch" role="group" aria-label="显示方式">
                    <button type="button" data-view="grid" aria-label="卡片视图" title="卡片视图" aria-pressed="true"><i data-lucide="layout-grid"></i></button>
                    <button type="button" data-view="list" aria-label="列表视图" title="列表视图" aria-pressed="false"><i data-lucide="list"></i></button>
                </div>
                <button type="button" id="add-btn" class="button button--primary">
                    <i data-lucide="plus"></i><span class="button-label">添加链接</span>
                </button>
            </div>

            <div class="sidebar-footer">
                <button type="button" id="sync-status" class="sync-status" disabled aria-live="polite" data-state="saving">
                    <span class="sync-dot" aria-hidden="true"></span>
                    <span class="sync-text">正在连接…</span>
                </button>
                <div class="sidebar-tools">
                    <button type="button" id="theme-toggle" class="icon-button" aria-label="切换明暗主题" title="切换主题">
                        <i data-lucide="moon" class="theme-dark"></i>
                        <i data-lucide="sun" class="theme-light"></i>
                    </button>
                    <button type="button" id="import-btn" class="icon-button" aria-label="导入数据" title="导入数据">
                        <i data-lucide="upload"></i>
                    </button>
                    <button type="button" id="export-btn" class="icon-button" aria-label="导出数据" title="导出数据">
                        <i data-lucide="download"></i>
                    </button>
                </div>
            </div>
            </div>
        </header>

        <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>
        <aside id="category-sidebar" class="category-sidebar" aria-labelledby="sidebar-title" tabindex="-1">
            <div class="sidebar-heading">
                <div><p class="eyebrow">COLLECTIONS</p><h2 id="sidebar-title">资料库</h2></div>
                <button type="button" id="sidebar-close" class="icon-button sidebar-close" aria-label="收起分类"><i data-lucide="x"></i></button>
            </div>
            <nav id="category-nav" class="category-nav" aria-label="链接分类"></nav>
            <button type="button" id="manage-categories-btn" class="button category-manage" aria-label="管理分类" title="管理分类">
                <i data-lucide="settings"></i><span>管理分类</span>
            </button>
        </aside>

        <div class="workspace">
            <main class="canvas" id="main-content" tabindex="-1">
                <h1 id="page-title" class="sr-only">全部收藏</h1>
                <div id="link-grid" class="link-grid"></div>

                <section id="empty-state" class="empty-state" hidden>
                    <span class="empty-icon" aria-hidden="true"><i data-lucide="inbox"></i></span>
                    <h3 class="empty-title">留一个位置，给下一个灵感</h3>
                    <p class="empty-text">把常用的网站收藏在这里，随时轻松抵达。</p>
                    <button type="button" id="empty-add-btn" class="button button--primary">
                        <i data-lucide="plus"></i><span>添加第一个链接</span>
                    </button>
                </section>
            </main>
        </div>
    </div>

    <!-- 链接编辑 -->
    <div id="modal-overlay" class="dialog-overlay" hidden>
        <div class="dialog-wrap">
            <div id="modal-content" class="dialog dialog--narrow">
                <header class="dialog-head">
                    <div class="dialog-heading">
                        <h2 id="modal-title" class="dialog-title">添加链接</h2>
                        <p id="modal-subtitle" class="dialog-sub">写下标题与网址，稍后随时调整。</p>
                    </div>
                    <button type="button" id="modal-close" class="icon-button" aria-label="关闭"><i data-lucide="x"></i></button>
                </header>
                <form id="link-form" class="dialog-body dialog-form">
                    <input type="hidden" id="link-id">
                    <div class="field">
                        <label for="link-title" class="field-label">标题</label>
                        <input type="text" id="link-title" maxlength="200" required class="field-input" placeholder="例如：GitHub">
                    </div>
                    <div class="field">
                        <label for="link-url" class="field-label">网址</label>
                        <input type="text" inputmode="url" autocapitalize="off" spellcheck="false" id="link-url" required class="field-input" placeholder="https://example.com">
                    </div>
                    <div class="field">
                        <span class="field-label">分类</span>
                        <div id="link-category-options" class="chip-group"></div>
                        <input type="hidden" id="link-category" value="uncategorized">
                    </div>
                    <div class="field">
                        <span class="field-label">图标</span>
                        <div class="icon-field">
                            <div class="icon-preview">
                                <img id="link-icon-preview" src="" alt="图标预览" hidden>
                                <span id="link-icon-placeholder"><i data-lucide="image"></i></span>
                            </div>
                            <div class="icon-field-actions">
                                <label for="link-icon-upload" class="button button--quiet">选择图片</label>
                                <input type="file" id="link-icon-upload" accept="image/*" hidden>
                                <input type="hidden" id="link-icon-data" value="">
                                <button type="button" id="link-icon-clear" class="button button--ghost" hidden>清除</button>
                                <p class="field-hint">JPG、PNG、GIF，最大 190 KB，建议 64 × 64。</p>
                            </div>
                        </div>
                    </div>
                    <footer class="dialog-foot">
                        <button type="button" id="modal-cancel" class="button button--ghost">取消</button>
                        <button type="submit" class="button button--primary">保存</button>
                    </footer>
                </form>
            </div>
        </div>
    </div>

    <!-- 分类管理 -->
    <div id="category-modal-overlay" class="dialog-overlay" hidden>
        <div class="dialog-wrap">
            <div id="category-modal-content" class="dialog dialog--wide">
                <header class="dialog-head">
                    <div class="dialog-heading">
                        <h2 id="category-modal-title" class="dialog-title">管理分类</h2>
                        <p class="dialog-sub">为收藏整理分组，所有设备保持同步。</p>
                    </div>
                    <button type="button" id="category-modal-close" class="icon-button" aria-label="关闭"><i data-lucide="x"></i></button>
                </header>
                <div class="dialog-body dialog-scroll">
                    <section class="panel">
                        <h3 class="panel-title">新建分类</h3>
                        <form id="category-form" class="dialog-form">
                            <div class="field-row">
                                <div class="field">
                                    <label for="category-name" class="field-label">名称</label>
                                    <input type="text" id="category-name" maxlength="80" class="field-input" placeholder="例如：设计灵感">
                                </div>
                                <button type="submit" class="button button--primary">添加分类</button>
                            </div>
                            <div class="field">
                                <span class="field-label">图标</span>
                                <div class="icon-picker">
                                    <button type="button" class="icon-option is-selected" data-icon="folder" aria-pressed="true"><i data-lucide="folder"></i></button>
                                    <button type="button" class="icon-option" data-icon="briefcase"><i data-lucide="briefcase"></i></button>
                                    <button type="button" class="icon-option" data-icon="gamepad-2"><i data-lucide="gamepad-2"></i></button>
                                    <button type="button" class="icon-option" data-icon="users"><i data-lucide="users"></i></button>
                                    <button type="button" class="icon-option" data-icon="book-open"><i data-lucide="book-open"></i></button>
                                    <button type="button" class="icon-option" data-icon="heart"><i data-lucide="heart"></i></button>
                                    <button type="button" class="icon-option" data-icon="star"><i data-lucide="star"></i></button>
                                    <button type="button" class="icon-option" data-icon="shopping-cart"><i data-lucide="shopping-cart"></i></button>
                                    <button type="button" class="icon-option" data-icon="music"><i data-lucide="music"></i></button>
                                    <button type="button" class="icon-option" data-icon="camera"><i data-lucide="camera"></i></button>
                                    <button type="button" class="icon-option" data-icon="code-2"><i data-lucide="code-2"></i></button>
                                    <button type="button" class="icon-option" data-icon="palette"><i data-lucide="palette"></i></button>
                                    <button type="button" class="icon-option" data-icon="film"><i data-lucide="film"></i></button>
                                    <button type="button" class="icon-option" data-icon="wallet"><i data-lucide="wallet"></i></button>
                                    <button type="button" class="icon-option" data-icon="plane"><i data-lucide="plane"></i></button>
                                    <button type="button" class="icon-option" data-icon="wrench"><i data-lucide="wrench"></i></button>
                                    <button type="button" class="icon-option" data-icon="mail"><i data-lucide="mail"></i></button>
                                    <button type="button" class="icon-option" data-icon="settings"><i data-lucide="settings"></i></button>
                                    <button type="button" class="icon-option" data-icon="globe"><i data-lucide="globe"></i></button>
                                    <button type="button" class="icon-option" data-icon="newspaper"><i data-lucide="newspaper"></i></button>
                                    <button type="button" class="icon-option" data-icon="graduation-cap"><i data-lucide="graduation-cap"></i></button>
                                    <button type="button" class="icon-option" data-icon="monitor-play"><i data-lucide="monitor-play"></i></button>
                                    <button type="button" class="icon-option" data-icon="sparkles"><i data-lucide="sparkles"></i></button>
                                    <button type="button" class="icon-option" data-icon="cpu"><i data-lucide="cpu"></i></button>
                                </div>
                                <input type="hidden" id="category-icon" value="folder">
                            </div>
                        </form>
                    </section>

                    <section class="panel panel--flush">
                        <h3 class="panel-title panel-title--row">现有分类</h3>
                        <div id="category-list" class="category-list"></div>
                    </section>
                </div>
            </div>
        </div>
    </div>

    <!-- 导入 / 导出 -->
    <div id="data-modal-overlay" class="dialog-overlay" hidden>
        <div class="dialog-wrap">
            <div id="data-modal-content" class="dialog">
                <header class="dialog-head">
                    <div class="dialog-heading">
                        <h2 id="data-modal-title" class="dialog-title">数据导出</h2>
                        <p id="data-modal-description" class="dialog-sub">选择要导出的分类，默认全选。</p>
                    </div>
                    <button type="button" id="data-modal-close" class="icon-button" aria-label="关闭"><i data-lucide="x"></i></button>
                </header>
                <div class="dialog-body dialog-scroll">
                    <div id="data-modal-body" class="stack"></div>
                    <footer class="dialog-foot">
                        <button id="data-modal-secondary" type="button" class="button button--ghost">取消</button>
                        <button id="data-modal-primary" type="button" class="button button--primary">确认</button>
                    </footer>
                </div>
            </div>
        </div>
    </div>

    <div id="drop-overlay" class="drop-overlay" hidden aria-hidden="true">
        <div class="drop-card">
            <span class="drop-icon"><i data-lucide="upload-cloud"></i></span>
            <strong>拖入 JSON 备份文件</strong>
            <span>读取后可以选择覆盖或追加到现有数据。</span>
        </div>
    </div>

    <div id="toast-container" role="status" aria-live="polite" class="toast-container"></div>
    <input type="file" id="import-file-input" accept="application/json,.json" hidden>

    <script type="module" src="app.js"></script>
</body>
</html>
