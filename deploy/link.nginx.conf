# Include ONLY inside the existing gbjson.cn HTTPS server block.
# Public bookmarks, including editing, as requested. Backend stays on loopback.
location = /link {
    return 301 /link/$is_args$args;
}

location = /link/api/data {
    client_max_body_size 8m;
    proxy_pass http://127.0.0.1:8791/api/data;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /link/ {
    proxy_pass http://127.0.0.1:8791/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
